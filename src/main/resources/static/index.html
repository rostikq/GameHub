    <form id="comment-form">

        <input type="text" id="username" placeholder="Your Name"><br>
        <label for="comment">Comment</label>

        rows="10" cols="50" style="     resize: none"></textarea>

</div>>
<script>
    const form = document.getElementById('comment-form');
    const commentContainer = document.getElementById('comment-container');

    form.addEventListener('submit', function(event) {
        event.preventDefault();

        const usernameVal = document.getElementById('username').value;
        const commentVal = document.getElementById('comment').value;
        const formData = {
            username: usernameVal,
            comment: commentVal,
        }

        fetch('/api/comment/submit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        })
            .then(response => {
                if (response.ok) {
                    loadComments();
                    alert('Comment posted successfully!');
                } else {
                    alert('Something went wrong on the server.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Network error, please try again.');
            });
    });

    async function loadComments() {
        try {
            const response = await fetch('/api/comment/getlast');
            if (!response.ok){
                throw new Error('Network response was not ok');
            }
            const comments = await response.json();

            commentContainer.innerHTML = '';

            comments.forEach(comment => {
                const commentElement = document.createElement('div');
                commentElement.className = 'comment-item';
                commentElement.innerHTML=
                    `<p>${escapeHTML(comment.username)}: ${comment.publicationDateTime.toString().substring(0,10)}</p>` +
                    `<p>${escapeHTML(comment.comment)}</p>`;
                commentContainer.appendChild(commentElement);
            });

        } catch (error) {
            console.error('Error:', error);
        }
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g,
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }

    document.addEventListener('DOMContentLoaded', loadComments);


</script>
